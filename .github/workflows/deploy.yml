name: Deploy N&D Financial System

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Protect production configuration
        shell: bash
        run: |
          if [ -f app_config/config.php ]; then
            echo "ERROR: app_config/config.php must not be committed."
            exit 1
          fi

      - name: Deploy public website to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "public_html/*,public_html/.htaccess"
          target: "/home/u446223237/domains/nd.sysdevt.online"
          overwrite: true

      - name: Deploy non-secret app files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "app_config/config.example.php,app_config/seed.json"
          target: "/home/u446223237/domains/nd.sysdevt.online"
          overwrite: true
